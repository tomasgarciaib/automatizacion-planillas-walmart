<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Automatización de planillas de productos para Walmart" />
    <title>{% block title %}Planillas Walmart{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Planillas Walmart</a>
      <span class="environment">Preparación de productos</span>
    </header>
    <main class="page-shell">{% block content %}{% endblock %}</main>
  </body>
</html>
