services:
  app:
    build: .
    container_name: planillas-walmart
    ports:
      - "8000:8080"
    environment:
      APP_ENV: development
      DATA_DIR: /app/data
      PORT: 8080
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
